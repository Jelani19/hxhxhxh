<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUNTER x HUNTER: Whale Island (Nen RPG Vertical Slice)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05080f;font-family:"Segoe UI",system-ui,sans-serif;color:#e8ecf4;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,16,.74);z-index:30;overflow:auto;padding:12px}
.ov.show{display:flex}
.card{background:#0e1626f2;border:1px solid #2e486e;border-radius:12px;padding:18px 22px;max-width:960px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 12px 50px #000b}
h1{font-size:28px;letter-spacing:1px;color:#ffd36b}
h2{font-size:19px;color:#ffd36b;margin-bottom:8px}
h3{font-size:14px;color:#8fd0ff;margin:12px 0 5px;text-transform:uppercase;letter-spacing:1px}
p,li{font-size:14px;line-height:1.5;color:#cfd8ea}
ul{padding-left:20px}
.sub{color:#8fa3c4;font-size:13px}
button,.btn{background:#1d3558;color:#fff;border:1px solid #3d669d;border-radius:7px;padding:7px 14px;font-size:14px;cursor:pointer;margin:3px 4px 3px 0}
button:hover{background:#2a4d82}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:#b8791a;border-color:#ffc35a}
button.pri:hover{background:#d8921f}
input,select,textarea{background:#0a1220;color:#fff;border:1px solid #38577f;border-radius:6px;padding:6px 8px;font-size:14px;max-width:100%}
input[type=color]{padding:0;width:44px;height:30px}
input[type=range]{width:150px;padding:0}
label{display:block;font-size:13px;color:#9fb4d6;margin:8px 0 3px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:230px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;border-bottom:1px solid #2e486e;padding-bottom:8px}
.tabs button{margin:0}
.tabs button.on{background:#b8791a;border-color:#ffc35a}
.bar{position:relative;height:15px;background:#0b1220;border:1px solid #2a3b57;border-radius:8px;overflow:hidden;margin:4px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;display:block;transition:width .08s}
.bar span{position:absolute;inset:0;font-size:11px;text-align:center;line-height:14px;color:#fff;text-shadow:0 0 3px #000}
.hp i{background:linear-gradient(#e05555,#a02020)}
.st i{background:linear-gradient(#e8d35a,#a58b1c)}
.au i{background:linear-gradient(#6fd3ff,#2a74d6)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px dotted #25354f}
.tag{display:inline-block;background:#18304f;border:1px solid #38577f;border-radius:10px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0}
.good{color:#7de39b}.bad{color:#ff8a8a}.warn{color:#ffd36b}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#hl{position:absolute;left:14px;top:12px;width:280px}
#pname{font-size:14px;font-weight:600;text-shadow:0 0 4px #000}
#chips{min-height:20px}
#mm{position:absolute;right:14px;top:12px;width:170px;text-align:center}
#mmc{border:2px solid #36527c;border-radius:50%;background:#0a1830;display:block}
#comp{font-size:12px;margin-top:3px;text-shadow:0 0 4px #000}
#qt{position:absolute;left:14px;top:150px;width:290px;font-size:13px;background:#0a1220aa;border-left:3px solid #ffc35a;padding:8px 10px;border-radius:0 8px 8px 0}
#qt b{color:#ffd36b}
#boss{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:420px;display:none;text-align:center}
#bossn{font-size:14px;text-shadow:0 0 4px #000;color:#ffb1b1}
#tgt{position:absolute;left:50%;top:60px;transform:translateX(-50%);font-size:13px;text-shadow:0 0 4px #000;text-align:center}
#abil{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px}
.slot{position:relative;width:86px;height:60px;background:#0b1424dd;border:1px solid #3d669d;border-radius:8px;padding:4px;font-size:11px;overflow:hidden;text-align:center}
.slot b{display:block;color:#ffd36b;font-size:12px}
.slot .cdo{position:absolute;left:0;right:0;bottom:0;background:#000a;height:0}

#dmgs{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}

.zone{position:absolute;top:0;bottom:0;background:#2fbf6b88;border-left:2px solid #7de39b;border-right:2px solid #7de39b}

td,th{font-size:13px;padding:3px 6px;border-bottom:1px solid #22324b;text-align:left;vertical-align:top}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ======================================================================
   HUNTER x HUNTER: WHALE ISLAND  -  single-file Three.js vertical slice
   Unofficial fan project. All models/sounds are procedural placeholders.
   Sections: Utils | Data | Audio | Renderer+World | Entities | Player |
             Combat | Nen | Enemy AI | Quests+Dialogue | Inventory |
             Save | UI | Main loop
   ====================================================================== */
if (typeof THREE === 'undefined') {
  document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:99;background:#05080f">Three.js could not be loaded from cdnjs. This single-file game needs an internet connection for that one library.</div>');
  throw new Error('THREE missing');
}

/* ============================ UTILS ============================ */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const TAU = Math.PI*2;
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
function rng(seed){ let s = seed>>>0; return () => (s = (s*1664525+1013904223)>>>0)/4294967296; }
function angDiff(a,b){ let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
const fwd = a => ({x:Math.sin(a), z:Math.cos(a)});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rint = (a,b) => Math.floor(a+Math.random()*(b-a+1));
function mat(c,o){ return new THREE.MeshLambertMaterial(Object.assign({color:c},o||{})); }

/* ============================ DATA ============================= */
// Nen hexagon order (clockwise). Affinity by ring distance from your own category:
// 0 -> 100%, 1 -> 80%, 2 -> 60%, 3 (opposite) -> 40%. (Commonly cited chart; see Research Index.)
const CATS = ['Enhancement','Transmutation','Emission','Specialization','Conjuration','Manipulation'];
const CATINFO = {
  Enhancement:{col:'#ff9f43',d:'Strengthens the body and what it touches. Straightforward and sturdy: your aura-infused strikes hit harder.'},
  Transmutation:{col:'#ff6bd6',d:'Changes the properties of aura (elastic, sticky, electric). Creative, adaptable tricks.'},
  Emission:{col:'#6fd3ff',d:'Projects aura away from the body. Strong at range, weaker up close.'},
  Specialization:{col:'#c8a8ff',d:'Abilities that fit no other category. Rare; hard to predict, narrow but strange.'},
  Conjuration:{col:'#7de39b',d:'Creates physical objects out of aura. Binding and control, usually with strict conditions.'},
  Manipulation:{col:'#ffd36b',d:'Controls objects or creatures. Excellent at making enemies work against each other.'}
};
function affinity(a,b){ const i=CATS.indexOf(a), j=CATS.indexOf(b); if(i<0||j<0) return 0; const d=Math.min(Math.abs(i-j),6-Math.abs(i-j)); return [100,80,60,40][d]; }

const ITEMS = {
  herb:{n:'Healing Herb',d:'Restores 35 HP.',use:()=>{ heal(35); }, buy:30, sell:12},
  fish:{n:'Grilled Fish',d:'Restores 60 stamina and 10 HP.',use:()=>{ S.st=Math.min(maxST(),S.st+60); heal(10); }, buy:20, sell:8},
  tonic:{n:'Aura Tonic',d:'Restores 30 aura (needs Ten learned).',use:()=>{ if(!S.nen.unlocked){toast('You cannot sense aura yet.');return false;} S.aura=Math.min(maxAura(),S.aura+30); }, buy:60, sell:25},
  pelt:{n:'Foxbear Pelt',d:'Trophy and trade good.',use:null, sell:40},
  letter:{n:'Hunter Exam Registration Letter',d:'Quest item. Your invitation to the next stage of your journey.',use:null, sell:0}
};

// Signature techniques (ORIGINAL to this game, labelled; they follow category flavour only)
const SIG = {
  Enhancement:{name:'Aura Rush',eff:'dash',power:5,range:8,cd:6,cost:18,d:'Burst forward, striking anything in your path.'},
  Transmutation:{name:'Elastic Pull',eff:'pull',power:3,range:14,cd:7,cost:16,d:'Stretchy aura hooks a target and snaps it toward you.'},
  Emission:{name:'Aura Bolt',eff:'bolt',power:5,range:26,cd:3,cost:14,d:'Fire a bolt of aura that bursts on impact.'},
  Conjuration:{name:'Conjured Chains',eff:'bind',power:5,range:12,cd:10,cost:22,fragile:true,d:'Chains bind a target. Fragile: they shatter if YOU are hit.'},
  Manipulation:{name:'Puppet Thread',eff:'mark',power:5,range:12,cd:14,cost:30,d:'A thread takes control of a creature: it attacks other enemies.'},
  Specialization:{name:'Siphon Palm',eff:'drain',power:5,range:4,cd:6,cost:20,d:'Strange contact ability: harms the target and feeds you.'}
};
const KO = {name:'Ko (Focused Fist)',eff:'strike',power:12,range:3,cd:8,cost:25,ko:true,d:'Concentrate aura in the fist: huge strike. The rest of your body is left defenseless for 4s.'};

const EFFECTS = {
  strike:{n:'Strike (close arc)',base:1.0,fit:['Enhancement','Transmutation']},
  bolt:{n:'Bolt (projectile)',base:1.5,fit:['Emission','Transmutation']},
  bind:{n:'Bind (hold target)',base:3.0,fit:['Conjuration','Manipulation','Transmutation']},
  heal:{n:'Heal (self)',base:2.0,fit:['Enhancement','Specialization','Conjuration']},
  dash:{n:'Dash strike (mobility)',base:2.0,fit:['Enhancement','Transmutation','Emission']},
  mark:{n:'Puppet (control)',base:4.0,fit:['Manipulation','Specialization']},
  drain:{n:'Drain (touch)',base:3.0,fit:['Specialization','Manipulation']},
  pull:{n:'Pull (yank target)',base:2.0,fit:['Transmutation','Manipulation','Conjuration']}
};
const VOWS = {
  ren:{n:'Only while Ren is active',pts:3},
  melee:{n:'Only within 4 m of an enemy',pts:2.5},
  life:{n:'Costs 15% max HP per use',pts:3},
  exhaust:{n:'Ten is sealed for 6s after use',pts:2},
  night:{n:'Only usable at night (18:00-06:00)',pts:3}
};

const ATK = {
  bite:{wind:0.55,rec:0.7,range:3.2,arc:0.9,mult:1,block:true,kind:'melee',tg:'ring'},
  lunge:{wind:0.8,rec:1.0,range:2.6,arc:1.0,mult:1.25,block:true,kind:'lunge',dist:7,dur:0.3,tg:'line'},
  sweep:{wind:1.0,rec:1.1,range:5.8,arc:Math.PI,mult:1.1,block:true,kind:'melee',tg:'ring'},
  grab:{wind:0.9,rec:1.2,range:3.8,arc:0.8,mult:1.5,block:false,kind:'melee',tg:'ring'},
  charge:{wind:1.4,rec:1.8,range:2.8,arc:1.2,mult:1.8,block:false,kind:'charge',dist:20,dur:0.9,tg:'line'}
};
const ETYPES = {
  foxbear:{name:'Foxbear',lvl:2,hp:90,dmg:12,spd:3.0,chase:5.4,scale:1.5,col:0xb86a2e,guard:1,atks:['bite','lunge'],rad:1.2,xp:45,stagRes:1,detect:16},
  alpha:{name:'Alpha Foxbear',lvl:6,hp:520,dmg:22,spd:3.4,chase:5.8,scale:2.5,col:0x4d2a1a,guard:0.3,atks:['bite','lunge','sweep','grab','charge'],rad:2.4,xp:420,stagRes:0.3,boss:true,detect:18}
};

const QUIZ = [
  {q:'A stranger rows off with the fish you caught. You...',a:[['Chase them down and take it back.',{Enhancement:2}],['Call out a deal that makes them bring it back themselves.',{Manipulation:2}],['Throw a stone to snag the oar from afar.',{Emission:2}],['Catch another. You can make something from nothing.',{Conjuration:2}]]},
  {q:'Your fishing line keeps snapping. You...',a:[['Test it with a harder pull until you know its limit.',{Enhancement:2}],['Rub it with sap until it turns sticky and stretchy.',{Transmutation:2}],['Learn the current and drift with it.',{Manipulation:1,Specialization:1}],['Weave a new line from grass.',{Conjuration:2}]]},
  {q:'On a stormy night you hear a noise outside. You...',a:[['Step out and face it.',{Enhancement:1,Emission:1}],['Hold still and listen until it moves.',{Specialization:1,Manipulation:1}],['Light a flame and watch what shadows it throws.',{Transmutation:2}],['Think of a trap and set it.',{Conjuration:1,Manipulation:1}]]},
  {q:'Which feels most like you?',a:[['Stubborn and direct.',{Enhancement:2}],['Playful and unpredictable.',{Transmutation:2}],['Patient and exact.',{Emission:1,Manipulation:1}],['Odd. People cannot quite place me.',{Specialization:2}]]},
  {q:'Facing someone stronger, you would...',a:[['Hit harder.',{Enhancement:2}],['Hit from a safe distance.',{Emission:2}],['Make them fight someone else.',{Manipulation:2}],['Prepare something unexpected.',{Conjuration:1,Transmutation:1,Specialization:1}]]}
];

const DRILL = {
  ten:{n:'Ten: steady aura flow',speed:0.85,zone:0.28,d:'Keep the flow even. Press SPACE when the marker is inside the green band.'},
  zetsu:{n:'Zetsu: suppress aura',speed:1.05,zone:0.22,d:'Shut the flow off cleanly. Time it right.'},
  ren:{n:'Ren: raise output',speed:1.3,zone:0.18,d:'Surge the aura at the right instant. Fast and unforgiving.'}
};

/* ===================== PLAYER SAVE STATE (S) ==================== */
function newState(){
  return {
    v:1,name:'Hunter',bg:'fisher',
    look:{skin:'#e0ac82',hair:'#2b2118',hairStyle:'spiky',outfit:'#2f8f5b',build:'average',style:'brawler'},
    pos:{x:0,z:12},hp:100,st:100,aura:0,level:1,xp:0,clock:8,jenny:100,
    nen:{unlocked:false,cat:null,aff:null,ten:0,zetsu:0,ren:0,hatsu:0,sess:{day:-1,n:0}},
    customs:[null,null],
    inv:{herb:2,fish:1},
    quests:{main:{step:0,kills:0},herb:{state:0}},
    rel:{mito:{trust:20,respect:10,fear:0},goro:{trust:5,respect:5,fear:0}},
    faction:{village:10,hunters:0},
    license:{stage:0},
    stats:{attacks:0,heavy:0,blocks:0,dodges:0,pickups:0,zetsu:0,hatsu:0,kills:0,deaths:0},
    taken:[],respawnAt:{x:0,z:12},flags:{alphaDead:false,sliceDone:false,askedLore:false},playtime:0
  };
}
let S = newState();
const maxHP = () => 100+S.level*15+(S.look.build==='strong'?15:0)+(S.bg==='wanderer'?10:0);
const maxST = () => 100+S.level*3+(S.bg==='fisher'?10:0);
const maxAura = () => S.nen.unlocked ? Math.round(40+S.level*6+(S.nen.ten+S.nen.ren+S.nen.zetsu)*0.25+(S.bg==='scholar'?10:0)) : 0;
const xpNeed = () => Math.round(60*Math.pow(S.level,1.4));
const aff = cat => S.nen.cat ? affinity(S.nen.cat,cat) : 0;
function heal(n){ S.hp=Math.min(maxHP(),S.hp+n); }
const hoursToday = () => ((S.clock%24)+24)%24;
const dayNo = () => Math.floor(S.clock/24);

/* ============================ AUDIO ============================ */
const Aud = {
  ctx:null,master:null,vol:0.6,music:true,noiseBuf:null,amb:null,ambF:null,
  init(){
    if(this.ctx) return;
    try{
      const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
      this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value=this.vol; this.master.connect(this.ctx.destination);
      const len=this.ctx.sampleRate*2, buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.noiseBuf=buf;
      const src=this.ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
      const g=this.ctx.createGain(); g.gain.value=0; src.connect(f); f.connect(g); g.connect(this.master); src.start();
      this.amb=g; this.ambF=f;
      const lfo=this.ctx.createOscillator(); lfo.frequency.value=0.12; const lg=this.ctx.createGain(); lg.gain.value=160; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    }catch(e){ this.ctx=null; }
  },
  setVol(v){ this.vol=v; if(this.master) this.master.gain.value=v; },
  tone(freq,dur,type,vol,slide,delay){
    if(!this.ctx) return; const t=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.03);
  },
  noise(dur,vol,freq,type){
    if(!this.ctx||!this.noiseBuf) return; const t=this.ctx.currentTime;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; const f=this.ctx.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq||1200;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t,Math.random()); s.stop(t+dur+0.05);
  },
  hit(){ this.noise(0.12,0.3,900); this.tone(120,0.12,'square',0.12,-60); },
  swing(){ this.noise(0.15,0.12,3000,'highpass'); },
  hurt(){ this.tone(90,0.25,'sawtooth',0.2,-40); this.noise(0.2,0.25,500); },
  aura(){ this.tone(220,0.5,'sine',0.1,440); },
  cast(){ this.tone(440,0.3,'triangle',0.14,330); this.noise(0.25,0.1,2500,'highpass'); },
  zetsu(){ this.tone(300,0.4,'sine',0.08,-200); },
  ui(){ this.tone(660,0.07,'square',0.05); },
  roar(){ this.tone(70,0.9,'sawtooth',0.25,-30); this.noise(0.8,0.25,400); },
  step(kind){ if(kind==='sand') this.noise(0.07,0.05,2500); else if(kind==='rock') this.noise(0.05,0.07,3500,'highpass'); else this.noise(0.06,0.045,1200); },
  ambience(shore,bossOn){
    if(!this.ctx||!this.amb) return;
    this.amb.gain.value = (0.03+0.13*shore)*(this.music?1:0.6);
  },
  musicTick(){
    if(!this.ctx||!this.music) return;
    const sc=[261.6,293.7,329.6,392,440,523.3]; const n=sc[rint(0,5)]*(Math.random()<0.3?0.5:1);
    this.tone(n,3.2,'sine',0.035); if(Math.random()<0.5) this.tone(n*1.5,3.0,'sine',0.02,0,0.4);

// ---- height function (shared by rendering and gameplay) ----
function baseH(x,z){
  const r = Math.hypot(x,z);
  const hills = 5+2.6*Math.sin(x*0.06+1.3)*Math.cos(z*0.055)+1.6*Math.sin(x*0.13+z*0.11)+0.8*Math.sin(z*0.21-x*0.17);
  const isl = clamp((84-r)/34,0,1);
  let h = hills*isl-(1-isl)*6;
  const dv = Math.hypot(x,z-10);
  h = lerp(h,2.4,1-smooth(13,26,dv));
  const dm = Math.hypot(x,z+58);
  h += 13*Math.exp(-dm*dm/500);
  return h;
}
const PIER = {x:8,zs:60,z0:57,z1:75};
(function(){ for(let z=92;z>10;z-=0.5){ if(baseH(PIER.x,z)>0.3){ PIER.zs=z; break; } } PIER.z0=PIER.zs-3; PIER.z1=PIER.zs+15; })();
function groundY(x,z){ let h=baseH(x,z); if(Math.abs(x-PIER.x)<1.4&&z>PIER.z0&&z<PIER.z1) h=Math.max(h,0.45); return h; }

const world = {colliders:[],interact:[],enemies:[],npcs:[],herbs:[],proj:[],decor:{}};
function blocked(x,z,r){
  if(Math.hypot(x,z)>92) return true;
  if(groundY(x,z)<-0.75) return true;
  for(let i=0;i<world.colliders.length;i++){ const c=world.colliders[i]; const dx=x-c.x,dz=z-c.z,rr=c.r+r; if(dx*dx+dz*dz<rr*rr) return true; }
  return false;
}
function slideMove(pos,dx,dz,r){
  if(!blocked(pos.x+dx,pos.z+dz,r)){ pos.x+=dx; pos.z+=dz; return true; }
  if(!blocked(pos.x+dx,pos.z,r)){ pos.x+=dx; return true; }
  if(!blocked(pos.x,pos.z+dz,r)){ pos.z+=dz; return true; }
  return false;
}
function findLand(x,z,minH,maxH){
  minH=minH===undefined?1.3:minH; maxH=maxH===undefined?9:maxH;
  for(let r=0;r<45;r+=1.5) for(let a=0;a<TAU;a+=0.5){
    const xx=x+Math.cos(a)*r, zz=z+Math.sin(a)*r, h=baseH(xx,zz);
    if(h>minH&&h<maxH&&!blocked(xx,zz,1.2)) return {x:xx,z:zz};
  }
  return {x,z};
}

  const ring=new THREE.Mesh(new THREE.RingGeometry(0.85,1,36),new THREE.MeshBasicMaterial({color:0xff2a2a,transparent:true,opacity:0.6,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2; ring.visible=false; scene.add(ring);
  const line=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0xff2a2a,transparent:true,opacity:0.45,side:THREE.DoubleSide,depthWrite:false}));
  line.rotation.x=-Math.PI/2; line.visible=false; scene.add(line);
  const e={id,type,T,mesh,ring,line,pos:new THREE.Vector3(x,y,z),home:{x,z},face:Math.random()*TAU,hp:T.hp,maxhp:T.hp,
    lvl:T.lvl,dmg:T.dmg,guard:T.guard,radius:T.rad,state:'idle',t:0,aggro:false,dead:false,stun:0,bound:0,puppet:0,pcd:0,flash:0,
    atk:null,cd:1+Math.random(),wander:{x,z,t:0},kx:0,kz:0,fragile:false,vulnerable:0,phase2:false,speedMul:1,respawnAt:0,deathT:0,pullT:0,pullDir:null,strikeDone:false};
  world.enemies.push(e); return e;
}
function buildEnemies(){
  for(const e of world.enemies){ scene.remove(e.mesh); scene.remove(e.ring); scene.remove(e.line); }
  world.enemies.length=0;
  const spots=[[26,-18],[-28,-24],[14,-36],[-18,-44],[34,-4]];
  spots.forEach((p,i)=>{ const l=findLand(p[0],p[1],1.5,9); spawnEnemy('fb'+i,'foxbear',l.x,l.z); });
  const al=spawnEnemy('alpha','alpha',0,-52);
  if(S.flags.alphaDead){ al.dead=true; al.hp=0; al.mesh.visible=false; al.respawnAt=Infinity; }
}

function onKeyPress(code){
  if(G.mode==='drill'){ if(code==='Space') drillPress(); return; }
  if(G.mode==='dialog'){ if(code==='Escape') closeDialog(); const n=parseInt(code.replace('Digit',''),10); if(n>=1&&n<=9) pickChoice(n-1); return; }
  if(G.mode==='menu'){
    const tabMap={KeyI:'inventory',KeyN:'nen',KeyJ:'journal',KeyC:'character',KeyM:'map',KeyK:'relations',KeyH:'hunter'};
    if(code==='Escape'){ closePanel(); return; }
    if(tabMap[code]){ if(G.panelTab===tabMap[code]) closePanel(); else openPanel(tabMap[code]); }
    return;
  }
  if(G.mode!=='play') return;
  switch(code){
    case 'KeyE': interact(); break;
    case 'Tab': toggleLock(); break;
    case 'Space': if(P.ground&&!P.dodge&&!P.atk&&!P.dead&&S.st>=8){ P.vy=7.2; P.ground=false; S.st-=8; P.stDelay=0.5; } break;
    case 'KeyV': tryAttack('light'); break;
    case 'KeyF': tryAttack('heavy'); break;
    case 'KeyQ': tryDodge(); break;
    case 'KeyT': toggleTen(); break;
    case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': castAbility(parseInt(code.slice(5),10)-1); break;
    case 'KeyI': openPanel('inventory'); break;
    case 'KeyN': openPanel('nen'); break;
    case 'KeyJ': openPanel('journal'); break;
    case 'KeyC': openPanel('character'); break;
    case 'KeyM': openPanel('map'); break;
    case 'KeyK': openPanel('relations'); break;
    case 'KeyH': openPanel('hunter'); break;
    case 'Escape': openPanel('system'); break;
  }
}
function toggleLock(){
  if(P.lock){ P.lock=null; return; }
  P.lock=nearestEnemy(26,true);
  if(!P.lock) toast('No target nearby');
}
function nearestEnemy(range,aliveOnly){
  let best=null,bd=range;
  for(const e of world.enemies){ if(e.dead) continue; const d=Math.hypot(e.pos.x-P.pos.x,e.pos.z-P.pos.z)-e.radius; if(d<bd){bd=d;best=e;} }
  return best;
}
function interact(){
  let best=null,bd=1e9;
  for(const it of world.interact){ if(it.dead) continue; const d=Math.hypot(it.x-P.pos.x,it.z-P.pos.z); if(d<it.r&&d<bd){bd=d;best=it;} }
  if(best) best.fn();
}
function nearestInteract(){
  let best=null,bd=1e9;
  for(const it of world.interact){ if(it.dead) continue; const d=Math.hypot(it.x-P.pos.x,it.z-P.pos.z); if(d<it.r&&d<bd){bd=d;best=it;} }
  return best;
}

/* ============================== COMBAT ========================= */
function renMult(){ return 1.3+0.7*S.nen.ren/100; }
function tenReduce(){ return 0.15+0.35*S.nen.ten/100; }
function detectRadius(base){
  let r=base;
  if(P.zetsu) r*=(1-(0.55+0.4*S.nen.zetsu/100));
  if(P.ren) r*=1.5;
  if(P.noise>0) r=Math.max(r,base*0.45);
  if(K.ShiftLeft&&P.speed>1) r*=1.2;
  return r;
}
function playerDamage(a){
  let d=(10+S.level*2.2)*(S.look.build==='strong'?1.12:1)*(S.look.style==='brawler'?1.15:1);
  d*= a.kind==='heavy'?2.1:[1,1.1,1.5][a.idx||0];
  let nen=false;
  if(P.ren){ d*=renMult()*(1+0.25*aff('Enhancement')/100); nen=true; }
  return {d,nen};
}
function tryAttack(kind){
  if(G.mode!=='play'||P.dead||P.atk||P.dodge||P.stun>0||P.dash) return;
  const cost=kind==='heavy'?22:9; if(S.st<cost) return;
  S.st-=cost; P.stDelay=0.7;
  if(kind==='light'){ P.comboIdx=P.comboT>0?(P.comboIdx+1)%3:0; P.comboT=0.9; } else P.comboIdx=0;
  const dur=kind==='heavy'?0.75:[0.42,0.4,0.55][P.comboIdx];
  P.atk={kind,t:0,dur,hit:dur*0.45,done:false,idx:P.comboIdx};
  const t=P.lock||nearestEnemy(4.5);
  if(t) P.face=Math.atan2(t.pos.x-P.pos.x,t.pos.z-P.pos.z); else { const f=camForward(); P.face=Math.atan2(f.x,f.z); }
  S.stats.attacks++; if(kind==='heavy') S.stats.heavy++;
  Aud.swing(); P.noise=1.5;
}
function resolvePlayerHit(a){
  const range=a.kind==='heavy'?3.3:2.8; let any=false;
  for(const e of world.enemies){
    if(e.dead) continue; const dx=e.pos.x-P.pos.x,dz=e.pos.z-P.pos.z; const d=Math.hypot(dx,dz)-e.radius; if(d>range) continue;
    if(Math.abs(angDiff(P.face,Math.atan2(dx,dz)))>1.15) continue;
    const dm=playerDamage(a);
    hurtEnemy(e,dm.d,{nen:dm.nen,stagger:a.kind==='heavy'?0.7:(a.idx===2?0.5:0.15),knock:a.kind==='heavy'?3.2:1.2,ambush:true});
    any=true;
  }
  if(any){ G.hitstop=0.05; Aud.hit(); G.shake=0.18; }
}
function tryDodge(){
  if(G.mode!=='play'||P.dead||P.dodge||P.stun>0||P.dash) return;
  const cost=S.look.style==='evasive'?10:16; if(S.st<cost) return;
  S.st-=cost; P.stDelay=0.6;
  const m=moveInput(); let dx=m.x,dz=m.z; if(Math.hypot(dx,dz)<0.1){ const f=fwd(P.face); dx=-f.x; dz=-f.z; }
  const l=Math.hypot(dx,dz); dx/=l; dz/=l;
  P.dodge={t:0,dur:0.4,dx,dz}; P.invuln=S.look.style==='evasive'?0.32:0.25; P.atk=null; S.stats.dodges++;
  A.dodges+=1; Aud.tone(200,0.15,'sine',0.06,200);
}
function hurtEnemy(e,dmg,o){
  o=o||{}; if(e.dead) return;
  let d=dmg; const plain=!o.nen;
  if(plain) d*=e.guard;
  let ambush=false;
  if(o.ambush&&!e.aggro&&e.state==='idle'){ d*=2; ambush=true; }
  if(e.vulnerable>0) d*=1.5;
  d=Math.max(1,Math.round(d));
  e.hp-=d; e.flash=0.12; G.lastHit=e;
  showDmg(e.pos,d,{nen:o.nen,ambush,guarded:plain&&e.guard<1});
  if(e.state==='idle'||e.puppet>0===false&&!e.aggro){ e.aggro=true; if(e.state==='idle') e.state='chase'; }
  e.aggro=true;
  const stg=(o.stagger||0)*e.T.stagRes;
  if(stg>0.18&&e.state!=='charging'){ e.stun=Math.max(e.stun,stg); e.state='stagger'; e.atk=null; e.ring.visible=false; e.line.visible=false; }
  if(o.knock){ const dx=e.pos.x-P.pos.x,dz=e.pos.z-P.pos.z,l=Math.hypot(dx,dz)||1; const kk=o.knock*(e.T.boss?0.3:1); e.kx=dx/l*kk*4; e.kz=dz/l*kk*4; }
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  e.dead=true; e.hp=0; e.state='dead'; e.deathT=0; e.ring.visible=false; e.line.visible=false; e.mesh.userData.bound.visible=false; e.mesh.userData.pup.visible=false;
  S.stats.kills++; if(P.lock===e) P.lock=null;
  const lvlDiff=S.level-e.lvl; const xp=Math.round(e.T.xp*clamp(1-lvlDiff*0.25,0.1,1)); gainXP(xp);
  const jen=rint(8,20)*(e.T.boss?10:1); S.jenny+=jen;
  if(e.type==='foxbear'){ if(Math.random()<0.7){ S.inv.pelt=(S.inv.pelt||0)+1; toast('Dropped: Foxbear Pelt'); } e.respawnAt=S.clock+6; }
  else { S.flags.alphaDead=true; S.inv.tonic=(S.inv.tonic||0)+2; toast('The Alpha falls. Dropped: 2 Aura Tonics'); e.respawnAt=Infinity; }
  toast('+'+xp+' XP, +'+jen+' Jenny');
  const q=S.quests.main;
  if(e.type==='foxbear'&&q.step===2){ q.kills++; if(q.kills>=3){ q.step=3; toast('Quest updated: return to Goro for the water divination.'); } else toast('Foxbears defeated: '+q.kills+'/3'); }
  if(e.type==='alpha'&&q.step===4){ q.step=5; toast('Quest updated: return to Mito.'); }
  Aud.hit(); G.abilDirty=true;
}
function gainXP(n){
  S.xp+=n;
  while(S.xp>=xpNeed()&&S.level<30){ S.xp-=xpNeed(); S.level++; S.hp=maxHP(); S.st=maxST(); if(S.nen.unlocked) S.aura=maxAura(); toast('LEVEL UP! You are level '+S.level); Aud.tone(520,0.4,'triangle',0.12,520); }
}
// Adaptive tracking for the Alpha: counts decay over time
const A={blocks:0,dodges:0};
function hurtPlayer(dmg,e,atk,dirX,dirZ){
  if(P.dead||S.flags.sliceDone&&false) return false;
  if(P.invuln>0) return false;
  const f=fwd(P.face);
  // block / parry
  if(P.block&&atk.block){
    const ang=Math.abs(angDiff(P.face,Math.atan2(e.pos.x-P.pos.x,e.pos.z-P.pos.z)));
    if(ang<1.0){
      if(P.blockT<0.22){ // parry
        e.stun=Math.max(e.stun,e.T.boss?0.7:1.4); e.state='stagger'; e.atk=null; e.ring.visible=false; e.line.visible=false;
        toast('PARRY!'); Aud.tone(900,0.15,'square',0.12); G.hitstop=0.08; S.stats.blocks++; A.blocks++; return false;
      }
      const cost=dmg*(S.look.style==='guardian'?0.6:1.0);
      if(S.st>=cost*0.6){ S.st-=cost*0.6; S.stats.blocks++; A.blocks++; dmg*=(S.look.style==='guardian'?0.15:0.25); Aud.tone(300,0.1,'square',0.1); P.stDelay=1; }
      else { dmg*=0.8; P.block=false; P.stun=0.5; }
    }
  }
  let m=1;
  if(P.zetsu) m*=1.5;
  if(P.koT>0) m*=1.6;
  else if(P.ten&&!P.zetsu) m*=(1-tenReduce());
  if(P.ren) m*=0.85;
  dmg=Math.max(1,Math.round(dmg*m));
  S.hp-=dmg; P.hurtT=0.25; Aud.hurt(); G.shake=0.3;
  showDmg(P.pos,dmg,{player:true});
  if(P.zetsu){ P.zetsu=false; }
  // fragile conjured chains break when the caster is hurt
  for(const en of world.enemies){ if(en.fragile&&en.bound>0){ en.bound=0; en.fragile=false; toast('Your chains shattered!'); } }
  if(atk.kind==='melee'||atk.kind==='lunge'||atk.kind==='charge'){ const l=Math.hypot(dirX,dirZ)||1; P.kx=dirX/l*5; P.kz=dirZ/l*5; }
  if(S.hp<=0) playerDie();
  return true;
}
function playerDie(){
  P.dead=true; S.stats.deaths++; S.hp=0; P.ten=P.ren=P.zetsu=false; P.atk=null;
  setMode('dead');
  showOv('<h2>Defeated</h2><p>You collapse in the undergrowth. Nen is not about power alone: read telegraphs, use the terrain, and know when to withdraw.</p><p class="sub">Respawning at your last checkpoint costs 20% of your Jenny.</p><button class="pri" data-act="respawn">Wake at checkpoint</button>');
}
function respawn(){
  S.jenny=Math.floor(S.jenny*0.8); S.hp=maxHP(); S.st=maxST(); S.aura=Math.min(maxAura(),S.aura+Math.round(maxAura()*0.5));
  placePlayer(S.respawnAt.x,S.respawnAt.z); P.dead=false; P.lock=null; P.stun=0; P.invuln=1.5; P.kx=P.kz=0;
  for(const e of world.enemies){ if(!e.dead){ e.aggro=false; e.state='idle'; e.atk=null; e.ring.visible=false; e.line.visible=false; e.hp=Math.max(e.hp,e.maxhp*0.7); } }
  hideOv(); setMode('play'); toast('You wake at the campfire.');
}
function rest(x,z){
  S.hp=maxHP(); S.st=maxST(); S.aura=maxAura(); S.respawnAt={x:x+1.5,z:z+1.5};
  S.clock+=1; // an hour passes
  toast('Rested. Checkpoint set. Game saved.'); doSave(true);
  const now=S.clock;
  for(const e of world.enemies){ if(e.dead&&e.respawnAt<=now&&e.type!=='alpha') reviveEnemy(e); }
}
function reviveEnemy(e){
  e.dead=false; e.hp=e.maxhp; e.state='idle'; e.aggro=false; e.mesh.visible=true; e.mesh.rotation.z=0; e.mesh.position.set(e.home.x,groundY(e.home.x,e.home.z),e.home.z); e.pos.set(e.home.x,e.mesh.position.y,e.home.z); e.bound=0; e.stun=0; e.puppet=0;
}

/* floating damage numbers (pooled DOM) */
const dmgPool=[]; for(let i=0;i<24;i++){ const d=document.createElement('div'); d.className='dmg'; $('#dmgs').appendChild(d); dmgPool.push({el:d,t:0,pos:new THREE.Vector3()}); }
function showDmg(pos,val,o){
  const s=dmgPool.find(x=>x.t<=0)||dmgPool[0]; s.t=0.9; s.pos.set(pos.x,pos.y+2.2,pos.z);
  s.el.textContent=(o.ambush?'AMBUSH ':'')+val+(o.guarded?' (hide)':''); s.el.style.color=o.player?'#ff6b6b':o.nen?'#7fe0ff':o.guarded?'#aaaaaa':'#ffffff'; s.el.style.display='block';
}
function updateDmgNums(dt){
  const v=new THREE.Vector3();
  for(const s of dmgPool){ if(s.t<=0){ s.el.style.display='none'; continue; } s.t-=dt; s.pos.y+=dt*1.2; v.copy(s.pos).project(camera);
    if(v.z>1){ s.el.style.display='none'; continue; }
    s.el.style.left=((v.x*0.5+0.5)*innerWidth)+'px'; s.el.style.top=((-v.y*0.5+0.5)*innerHeight)+'px'; s.el.style.opacity=clamp(s.t*2,0,1); }
}

/* ============================== NEN ============================ */
function toggleTen(){
  if(!S.nen.unlocked){ toast('You have not learned Ten yet. Talk to Goro.'); return; }
  if(P.tenSealed>0||P.koT>0){ toast('Ten is disrupted.'); return; }
  P.ten=!P.ten; if(P.ten){ P.zetsu=false; Aud.aura(); } toast(P.ten?'Ten: aura held around the body':'Ten released');
}
function getSlot(i){
  if(i===0) return S.nen.cat&&S.nen.divined?Object.assign({id:'sig',cat:S.nen.cat},SIG[S.nen.cat]):null;
  if(i===1) return S.nen.unlocked?Object.assign({id:'ko',cat:'Enhancement'},KO):null;
  return S.customs[i-2]||null;
}
function pickTarget(range){
  if(P.lock&&!P.lock.dead&&Math.hypot(P.lock.pos.x-P.pos.x,P.lock.pos.z-P.pos.z)-P.lock.radius<=range+1) return P.lock;
  let best=null,bd=range;
  for(const e of world.enemies){ if(e.dead) continue; const dx=e.pos.x-P.pos.x,dz=e.pos.z-P.pos.z,d=Math.hypot(dx,dz)-e.radius; if(d>bd) continue;
    if(Math.abs(angDiff(P.face,Math.atan2(dx,dz)))>1.0&&d>2) continue; bd=d; best=e; }
  return best;
}
function abilityDamage(ab){ return ab.power*(4.5+S.level*0.6)*(0.7+0.3*aff(ab.cat)/100)*(P.ren?1.15:1); }
function castAbility(i){
  if(G.mode!=='play'||P.dead) return;
  const ab=getSlot(i);
  if(!ab){ toast(i===0?'Signature technique unlocks after the water divination.':'Slot empty. Design a technique in the Nen menu (N).'); return; }
  if(!S.nen.unlocked){ toast('You have not learned Ten yet.'); return; }
  if(P.cd[i]>0){ return; }
  if(P.stun>0||P.dodge) return;
  if(S.aura<ab.cost){ toast('Not enough aura.'); return; }
  const vows=ab.vows||[];
  const near=nearestEnemy(4);
  if(vows.includes('ren')&&!P.ren){ toast('Vow: this technique only works while Ren is active.'); return; }
  if(vows.includes('melee')&&!near){ toast('Vow: needs an enemy within 4 m.'); return; }
  if(vows.includes('night')&&!(hoursToday()>=18||hoursToday()<6)){ toast('Vow: only usable at night.'); return; }
  if(vows.includes('life')&&S.hp<=maxHP()*0.15+1){ toast('Vow: not enough life to pay the cost.'); return; }
  const tgt=pickTarget(ab.eff==='bolt'?ab.range:Math.min(ab.range,28));
  const needsT=['bind','mark','drain','pull'].includes(ab.eff);
  if(needsT&&!tgt){ toast('No target in range.'); return; }
  if(ab.eff==='strike'||ab.eff==='bolt'){ const t2=tgt||P.lock; if(t2) P.face=Math.atan2(t2.pos.x-P.pos.x,t2.pos.z-P.pos.z); }
  if(needsT&&tgt) P.face=Math.atan2(tgt.pos.x-P.pos.x,tgt.pos.z-P.pos.z);
  S.aura-=ab.cost; P.cd[i]=ab.cd; P.cdMax[i]=ab.cd; S.stats.hatsu++; P.zetsu=false; P.noise=2; Aud.cast();
  S.nen.hatsu=Math.min(100,S.nen.hatsu+0.6/(1+S.nen.hatsu/20));
  if(vows.includes('life')) { S.hp-=maxHP()*0.15; showDmg(P.pos,Math.round(maxHP()*0.15),{player:true}); }
  if(vows.includes('exhaust')){ P.tenSealed=6; P.ten=false; }
  const dmg=abilityDamage(ab); const fx=fwd(P.face);
  switch(ab.eff){
    case 'strike': {

const SAVE_KEY='hxh3d_whale_island_v1';
function doSave(silent){

function sanitize(o){
  const base=newState();
  function merge(b,s){
    if(b===null||typeof b!=='object'||Array.isArray(b)){
      if(Array.isArray(b)){ return Array.isArray(s)?s.slice(0,64):b; }
      if(typeof b==='number'){ return typeof s==='number'&&isFinite(s)?s:b; }
      if(typeof b==='string'){ return typeof s==='string'?s.slice(0,200):b; }
      if(typeof b==='boolean'){ return typeof s==='boolean'?s:b; }
      return s===undefined?b:s;
    }
    const out={}; for(const k in b){ out[k]=merge(b[k],s&&typeof s==='object'?s[k]:undefined); }
    if(s&&typeof s==='object'){ for(const k in s){ if(!(k in b)&&['divined','savedAt','ranged'].includes(k)) out[k]=s[k]; } }
    return out;
  }
  const r=merge(base,o);
  // dynamic maps need explicit handling
  r.inv={}; if(o&&o.inv&&typeof o.inv==='object'){ for(const k in o.inv){ if(ITEMS[k]&&typeof o.inv[k]==='number'&&o.inv[k]>0) r.inv[k]=Math.floor(Math.min(o.inv[k],999)); } }
  r.customs=[null,null]; if(o&&Array.isArray(o.customs)){ for(let i=0;i<2;i++){ const c=o.customs[i]; if(c&&typeof c==='object'&&EFFECTS[c.eff]&&CATS.includes(c.cat)){ const vv=Array.isArray(c.vows)?c.vows.filter(v=>VOWS[v]).slice(0,2):[]; const chk={name:String(c.name||'Ability').slice(0,24),cat:c.cat,eff:c.eff,power:clamp(+c.power||1,1,10),range:clamp(+c.range||2,2,26),cd:clamp(+c.cd||1,1,20),vows:vv}; const v=validateAbility(chk); if(v.ok||true){ r.customs[i]=Object.assign(chk,{id:'c'+i,cost:Math.max(6,Math.round(+c.cost||v.cost))}); } } } }
  if(o&&o.nen&&o.nen.aff&&typeof o.nen.aff==='object') r.nen.aff=o.nen.aff; else r.nen.aff=null;
  r.nen.cat=(o&&o.nen&&CATS.includes(o.nen.cat))?o.nen.cat:null;
  r.nen.divined=!!(o&&o.nen&&o.nen.divined&&r.nen.cat);
  r.taken=(o&&Array.isArray(o.taken)?o.taken.filter(x=>typeof x==='string'):[]).slice(0,40);
  r.level=clamp(Math.floor(r.level),1,30); r.hp=clamp(r.hp,1,9999);
  r.quests.main.step=clamp(Math.floor(r.quests.main.step),0,6);
  return r;
}
function loadSave(){
  let raw=null; try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw){ toast('No saved game found.'); return false; }
  try{ const o=JSON.parse(raw); S=sanitize(o); applyLoaded(); return true; }
  catch(e){ toast('Save file is corrupted.'); return false; }

/* ---- maps ---- */
const mapImg=(function(){
  const cv=document.createElement('canvas'); cv.width=cv.height=190; const cx=cv.getContext('2d');
  if(!cx) return cv;
  for(let j=0;j<190;j++) for(let i=0;i<190;i++){ const x=i-95,z=j-95,h=baseH(x,z); let c; if(h<-0.3)c='#1d4f7a'; else if(h<0.5)c='#c9bd85'; else if(h<8)c=h<2.6&&Math.hypot(x,z-10)<18?'#9b8f6a':'#3c7a3c'; else if(h<13)c='#7a766c'; else c='#a7a69c'; cx.fillStyle=c; cx.fillRect(i,j,1,1); }
  return cv;
})();
function drawMap(cv,big){
  const cx=cv.getContext('2d'); if(!cx) return; const s=cv.width; const k=s/190;
  cx.clearRect(0,0,s,s); cx.save();
  if(!big){ cx.beginPath(); cx.arc(s/2,s/2,s/2,0,TAU); cx.clip(); }
  cx.drawImage(mapImg,0,0,s,s);
  const X=x=>(x+95)*k, Z=z=>(z+95)*k;
  cx.fillStyle='#7dffa0'; world.herbs.forEach(h=>{ if(!h.dead){ cx.fillRect(X(h.x)-1.5,Z(h.z)-1.5,3,3); } });
  cx.fillStyle='#ffd36b'; world.npcs.forEach(n=>{ cx.beginPath(); cx.arc(X(n.x),Z(n.z),big?4:3,0,TAU); cx.fill(); if(big){ cx.fillText(n.name,X(n.x)+6,Z(n.z)); } });
  cx.fillStyle='#ff9a30'; [[4,8],[fl2p.x,fl2p.z]].forEach(p=>{ cx.fillRect(X(p[0])-2,Z(p[1])-2,4,4); });
  world.enemies.forEach(e=>{ if(e.dead) return; cx.fillStyle=e.type==='alpha'?'#ff2a2a':'#ff7a7a'; cx.beginPath(); cx.arc(X(e.pos.x),Z(e.pos.z),e.type==='alpha'?(big?5:4):2.5,0,TAU); cx.fill(); });
  const t=questTarget(); if(t){ cx.strokeStyle='#fff3a0'; cx.lineWidth=2; cx.beginPath(); cx.arc(X(t.x),Z(t.z),big?9:6,0,TAU); cx.stroke(); }
  cx.translate(X(P.pos.x),Z(P.pos.z)); cx.rotate(-P.face+Math.PI); cx.fillStyle='#fff'; cx.beginPath(); cx.moveTo(0,-6); cx.lineTo(4,5); cx.lineTo(-4,5); cx.closePath(); cx.fill();
  cx.restore();
}

function updateEditorPreview(){
  if(!$('#e_name')) return; const f=readEditor(); $('#e_pv').textContent=f.power; $('#e_rv').textContent=f.range; $('#e_cv').textContent=f.cd;
  const v=validateAbility(f);

}
function saveHatsu(){
  const f=readEditor(); const v=validateAbility(f); if(!v.ok){ updateEditorPreview(); toast('Technique rejected. See the red notes.'); return; }
  const slot=+$('#e_slot').value; S.customs[slot]=Object.assign({},f,{id:'c'+slot,name:f.name.trim(),cost:v.cost}); G.abilDirty=true; toast('Saved to slot '+(slot+3)); refreshPanel();
}
function panelJournal(){

  steps.forEach((s,i)=>{ h+='<li class="'+(q.step>i?'good':q.step===i?'warn':'sub')+'">'+(q.step>i?'[done] ':q.step===i?'[now] ':'')+s+(i===2&&q.step===2?' ('+q.kills+'/3)':'')+'</li>'; });
  h+='</ul><p class="sub">'+questText()+'</p><h3>Side</h3><ul><li class="'+(S.quests.herb.state===2?'good':S.quests.herb.state===1?'warn':'sub')+'">Mito\'s herbs: '+(S.quests.herb.state===0?'not started (ask Mito)':S.quests.herb.state===1?'bring 5 Healing Herbs ('+(S.inv.herb||0)+'/5)':'complete')+'</li></ul>';
  h+='<h3>Hints</h3><ul><li>Foxbear attacks show a red ground telegraph. Dodge (Q) through them or block (RMB / B). A block in the first 0.2 s is a parry.</li><li>Zetsu (hold Z) hides you; striking an unaware enemy from Zetsu deals double damage but you take +50% damage while it is active.</li><li>The Alpha adapts: block a lot and it uses an unblockable grab, dodge a lot and it uses wide sweeps.</li></ul>'; return h;
}

  h+='</table><h3>Faction standing</h3><div class="kv"><span>Whale Island village</span><span>'+Math.round(S.faction.village)+'</span></div><div class="kv"><span>Hunter Association</span><span>'+Math.round(S.faction.hunters)+'</span></div><p class="sub">More factions (Zoldyck family, Phantom Troupe, mafia) arrive with later regions.</p>'; return h;
}
function panelMap(){ return '<h2>Whale Island</h2><canvas id="bigmap" width="520" height="520" style="max-width:100%;border:2px solid #36527c;border-radius:8px"></canvas><p class="hint">White arrow: you. Yellow: NPCs. Red: Foxbears (big red: Alpha). Orange squares: campfires. Green: herbs. Ring: current objective.</p>'; }
function panelHunter(){

}
function panelSystem(){
  const g=G.graphics;
  let h='<h2>System</h2><div class="row"><div class="col"><button class="pri" data-act="savegame">Save game</button><button data-act="loadgame2">Load game</button><button data-act="title">Quit to title</button>';
  h+='<h3>Settings</h3><label>Master volume</label><input type="range" id="s_vol" min="0" max="100" value="'+Math.round(Aud.vol*100)+'" data-act="setvol">';
  h+='<label>Mouse sensitivity</label><input type="range" id="s_sens" min="30" max="250" value="'+Math.round(g.sens*100)+'" data-act="setsens">';

  h+='<div><label style="display:inline"><input type="checkbox" id="s_music" data-act="setmusic" '+(Aud.music?'checked':'')+'> Ambient music</label></div>';
  h+='<label>Render scale</label><select id="s_res" data-act="setres"><option value="0.7">Low (0.7)</option><option value="1">Medium (1.0)</option><option value="1.5">High (1.5)</option></select>';
  h+='<label>View distance</label><select id="s_view" data-act="setview"><option value="90">Short</option><option value="170">Normal</option><option value="260">Far</option></select></div>';
  h+='<div class="col"><h3>Controls</h3><table>';
  [['WASD','Move'],['Shift','Sprint'],['Space','Jump'],['Mouse (click to capture)','Look; arrow keys also rotate the camera'],['LMB / V','Light attack (3-hit combo)'],['F','Heavy attack'],['RMB / B (hold)','Block; block just before impact = parry'],['Q','Dodge roll (brief invulnerability)'],['Tab','Lock-on / release'],['T','Toggle Ten'],['Hold R','Ren'],['Hold Z','Zetsu'],['1-4','Nen techniques'],['E','Interact / talk / rest'],['I N J C M K H','Inventory, Nen, Journal, Character, Map, Relations, License'],['Esc','This menu']].forEach(r=>{ h+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td></tr>'; });
  h+='</table></div></div>'; return h;
}
function showSliceDone(){
  const st=S.stats;
  showOv('<h2>Vertical Slice Complete</h2><p>You carry Mito\'s letter toward the Hunter Exam. The Whale Island chapter ends here, but you can keep exploring and training.</p><div class="kv"><span>Level</span><span>'+S.level+'</span></div><div class="kv"><span>Nen category</span><span>'+(S.nen.cat||'?')+'</span></div><div class="kv"><span>Enemies defeated</span><span>'+st.kills+'</span></div><div class="kv"><span>Times defeated</span><span>'+st.deaths+'</span></div><div class="kv"><span>Playtime</span><span>'+Math.floor(S.playtime/60)+' min</span></div><p class="sub">Next phases: Hunter Exam stages, Heavens Arena, more canon characters (after research), more regions.</p><button class="pri" data-act="closeov">Keep exploring</button>');
  setMode('menu'); G.panelTab='done';
}

/* ---- click delegation ---- */
const ACTS={
  newgame(){ S=newState(); setMode('create'); G.panelTab='create'; rebuildPlayerMesh(); placePlayer(0,12); P.face=2.6; showCreate(); },
  startgame(){ readCreate(); S.hp=maxHP(); S.st=maxST(); S.nen.aff=null; rebuildPlayerMesh(); placePlayer(0,12); P.face=0; P.cy=Math.PI; P.cp=0.35; P.dead=false;
    $('#ov').style.background='rgba(4,8,16,.74)'; $('#ov').style.justifyContent='center'; buildEnemies(); world.herbs.forEach(h=>{ h.dead=false; h.mesh.visible=true; });
    $('#hud').style.display='block'; G.abilDirty=true; setMode('play');
    showOv('<h2>Welcome to Whale Island, '+esc(S.name)+'</h2><p>Talk to <b>Mito</b> in the village (press E when near). Click the game view to capture the mouse. Open the controls any time with <b>Esc</b>.</p><p class="sub">WASD move | Shift sprint | LMB attack | RMB block | Q dodge | Tab lock-on | E interact</p><button class="pri" data-act="closeov">Begin</button>'); setMode('menu'); G.panelTab='intro'; Aud.init(); },
  loadgame(){ Aud.init(); if(loadSave()) toast('Game loaded.'); },
  loadgame2(){ if(loadSave()) toast('Game loaded.'); },
  title(){ showTitle(); $('#ov').style.background='rgba(4,8,16,.74)'; $('#ov').style.justifyContent='center'; },
  research(){ showResearch(); },
  closeov(){ hideOv(); setMode('play'); },
  closepanel(){ closePanel(); },
  tab(d){ G.panelTab=d.t; renderPanel(); },
  use(d){ useItem(d.id); }, buy(d){ buyItem(d.id); }, sell(d){ sellItem(d.id); },
  choice(d){ pickChoice(+d.i); },
  drillpress(){ drillPress(); }, drillquit(){ endDrill(); },
  solo(d){ hideOv(); startDrill(d.k,true); },
  quiz(d){ G.quizAns[+d.q]=+d.a; renderQuiz(+d.q+1); },
  savehatsu(){ saveHatsu(); },
  savegame(){ doSave(false); }, respawn(){ respawn(); },
  setvol(){ Aud.setVol(+$('#s_vol').value/100); },
  setsens(){ G.graphics.sens=+$('#s_sens').value/100; },
  setshadow(){ G.graphics.shadows=$('#s_shadow').checked; renderer.shadowMap.enabled=G.graphics.shadows; sun.castShadow=G.graphics.shadows; scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; }); },
  setmusic(){ Aud.music=$('#s_music').checked; },
  setres(){ G.graphics.res=+$('#s_res').value; renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5)*G.graphics.res/1.0>2?2:(devicePixelRatio||1)*G.graphics.res); },
  setview(){ G.graphics.view=+$('#s_view').value; scene.fog.far=G.graphics.view; }
};
document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const t=b.tagName; if((t==='INPUT'&&b.type==='range')||t==='SELECT') return;
  const f=ACTS[b.dataset.act]; if(f){ Aud.init(); f(b.dataset); }
});
document.body.addEventListener('input',e=>{ const b=e.target.closest('[data-act]'); if(b&&b.type==='range'){ const f=ACTS[b.dataset.act]; if(f) f(b.dataset); } });
document.body.addEventListener('change',e=>{ const b=e.target.closest('[data-act]'); if(b&&(b.tagName==='SELECT'||b.type==='checkbox')){ const f=ACTS[b.dataset.act]; if(f) f(b.dataset); } });

/* ============================ SKY / TIME ======================== */
const SKY={night:new THREE.Color(0x070b1c),day:new THREE.Color(0x7ec8ff),dawn:new THREE.Color(0xff9a6b),tmp:new THREE.Color()};
function updateSky(){
  const h=hoursToday(), a=(h-6)/12*Math.PI, sy=Math.sin(a), day=clamp(sy*2.2+0.25,0,1);
  const dawn=clamp(1-Math.abs(sy)*3.5,0,1);
  SKY.tmp.copy(SKY.night).lerp(SKY.day,day).lerp(SKY.dawn,dawn*0.55);
  scene.background.copy(SKY.tmp); scene.fog.color.copy(SKY.tmp);
  const cx=P.pos.x, cz=P.pos.z;
  sun.position.set(cx+Math.cos(a)*90,Math.max(sy,0.12)*90+8,cz+30); sun.target.position.set(cx,0,cz);
  sun.intensity=0.05+1.0*day; hemi.intensity=0.22+0.6*day;
  sunBall.position.set(cx+Math.cos(a)*300,Math.sin(a)*300,cz); sunBall.visible=sy>-0.05;
  moonBall.position.set(cx-Math.cos(a)*300,-Math.sin(a)*300,cz); moonBall.visible=sy<0.05;
  stars.material.opacity=clamp(1-day*1.6,0,0.95); stars.position.set(cx,0,cz);
  water.material.color.setRGB(0.1+0.07*day,0.25+0.2*day,0.35+0.25*day);
}
function updateAmbience(){
  const h=groundY(P.pos.x,P.pos.z); const shore=clamp(1-(h-0.2)/6,0,1)*0.9+(Math.hypot(P.pos.x,P.pos.z)>50?0.1:0); Aud.ambience(shore);
}

/* ============================ MAIN LOOP ======================== */
let last=performance.now(), fpsAcc=0, fpsN=0, saveTimer=0;
function update(dt){
  S.clock+=dt/60; S.playtime+=dt; G.t+=dt;
  if(G.hitstop>0){ G.hitstop-=dt; dt*=0.1; }
  updatePlayer(dt); updateBolts(dt);
  for(const e of world.enemies){ const d=Math.abs(e.pos.x-P.pos.x)+Math.abs(e.pos.z-P.pos.z); if(d>130&&!e.aggro) continue; updateEnemy(e,dt); }
  for(const n of world.npcs){ const dx=P.pos.x-n.x,dz=P.pos.z-n.z; if(Math.hypot(dx,dz)<7){ n.mesh.rotation.y+=clamp(angDiff(n.mesh.rotation.y,Math.atan2(dx,dz)),-3*dt,3*dt); } n.mesh.userData.torso.scale.y=1+Math.sin(G.t*1.8)*0.015; }
  for(const h of world.herbs){ if(!h.dead) h.mesh.rotation.y+=dt; }
  fire1.fl.scale.y=0.9+0.3*Math.sin(G.t*14); fireLight.intensity=0.7+0.2*Math.sin(G.t*11);
  saveTimer+=dt; if(saveTimer>90){ saveTimer=0; doSave(true); }
  updateCamera(dt);
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000||0.016); last=now;
  fpsAcc+=dt; fpsN++; if(fpsAcc>=0.5){ G.fps=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; $('#fps').textContent=G.fps+' fps | '+renderer.info.render.calls+' draws';
    if(G.fps<28&&G.mode==='play'){ G.lowFpsT+=0.5; if(G.lowFpsT>6){ G.lowFpsT=-30; toast('Low frame rate: try System > Render scale / Shadows.'); } } else if(G.lowFpsT>0) G.lowFpsT=0; }
  if(G.mode==='play'){ update(dt); }
  else if(G.mode==='drill'){ updateDrill(dt); }
  else if(G.mode==='title'||G.mode==='create'){
    G.t+=dt; const a=G.t*0.15; camera.position.set(Math.sin(a)*16,5,12+Math.cos(a)*16); camera.lookAt(0,2.5,10);
    if(G.mode==='create'&&P.mesh){ camera.position.set(Math.sin(0.7)*5,2.4,12+Math.cos(0.7)*5); camera.lookAt(0,1.5,12); P.mesh.rotation.y=2.6+Math.sin(G.t)*0.4; P.mesh.position.set(0,groundY(0,12),12); }
  } else if(G.mode==='dialog'||G.mode==='menu'||G.mode==='dead'){ G.t+=dt*0.0; }
  if(P.mesh&&G.mode==='title') P.mesh.position.set(2,groundY(2,14),14);
  updateSky(); water.position.y=Math.sin(G.t*0.8)*0.06; updateAmbience();
  if(G.mode==='play'||G.mode==='dialog'||G.mode==='menu'||G.mode==='drill'||G.mode==='dead'){ updateHUD(); updateDmgNums(dt); G.mapTick++; if(G.mapTick%4===0){ const cv=$('#mmc'); if(cv) drawMap(cv,false); } }
  renderer.render(scene,camera);
}
function boot(){
  rebuildPlayerMesh(); placePlayer(2,14); buildEnemies(); showTitle();
  requestAnimationFrame(frame);
}
boot();
